<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品商城 · 尹晓晓的个人博客与作品商城</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="works">

  <header class="site-header">
    <div class="navbar">
      <a href="index.html" class="logo"><span class="logo-mark">尹</span>尹晓晓的小站</a>
      <button class="nav-toggle" aria-label="打开菜单"><span></span><span></span><span></span></button>
      <nav class="nav-menu">
        <a href="index.html">首页</a>
        <a href="about.html">关于我</a>
        <a href="articles.html">博客</a>
        <a href="works.html">作品</a>
        <a href="messages.html">留言</a>
        <a href="cart.html" class="cart-link">购物车<span class="cart-badge" id="cart-count">0</span></a>
        <span id="nav-auth"></span>
      </nav>
    </div>
  </header>

  <section class="page-header">
    <h1>作品商城</h1>
    <div class="breadcrumb"><a href="index.html">首页</a> / 作品商城</div>
  </section>

  <main class="container page-wrap">
    <div class="shop-layout">

      <!-- 左侧分类导航（平板/手机端折叠为下拉选择） -->
      <aside class="category-side">
        <h3>作品分类</h3>
        <button class="category-item active" data-cat="全部">全部作品</button>
        <button class="category-item" data-cat="自动化框架">自动化框架</button>
        <button class="category-item" data-cat="用例模板">用例模板</button>
        <button class="category-item" data-cat="测试工具">测试工具</button>
        <button class="category-item" data-cat="学习资料">学习资料</button>
      </aside>

      <div class="shop-main">
        <!-- 窄屏下显示的分类下拉 -->
        <select class="category-select" id="category-select" aria-label="选择作品分类">
          <option value="全部">全部作品</option>
          <option value="自动化框架">自动化框架</option>
          <option value="用例模板">用例模板</option>
          <option value="测试工具">测试工具</option>
          <option value="学习资料">学习资料</option>
        </select>

        <!-- 作品网格（jQuery 动态渲染） -->
        <div class="card-grid" id="works-grid"></div>

        <div class="empty-state hidden" id="works-empty">
          <div class="empty-icon">🗂️</div>
          <h3>该分类下暂无作品</h3>
          <p>去看看其他分类的作品吧。</p>
          <button class="btn btn-primary" id="works-reset">查看全部作品</button>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <div class="footer-brand">尹晓晓的小站</div>
        <div class="footer-copy">© 2026 尹晓晓 · 个人博客与作品商城 · 纯前端学习实践项目</div>
      </div>
      <div class="footer-links">
        <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
        <a href="https://juejin.cn" target="_blank" rel="noopener">掘金</a>
        <a href="https://www.zhihu.com" target="_blank" rel="noopener">知乎</a>
        <a href="contact.html">联系我</a>
      </div>
    </div>
  </footer>

  <button id="back-to-top" title="回到顶部" aria-label="回到顶部">↑</button>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/common.js"></script>
  <script src="js/works.js"></script>
</body>
</html>
