<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 / 注册 · 尹晓晓的个人博客与作品商城</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

  <header class="site-header">
    <div class="navbar">
      <a href="index.html" class="logo"><span class="logo-mark">尹</span>尹晓晓的小站</a>
      <button class="nav-toggle" aria-label="打开菜单"><span></span><span></span><span></span></button>
      <nav class="nav-menu">
        <a href="index.html">首页</a>
        <a href="about.html">关于我</a>
        <a href="articles.html">博客</a>
        <a href="works.html">作品</a>
        <a href="messages.html">留言</a>
        <a href="cart.html" class="cart-link">购物车<span class="cart-badge" id="cart-count">0</span></a>
        <span id="nav-auth"></span>
      </nav>
    </div>
  </header>

  <section class="page-header">
    <h1>登录 / 注册</h1>
    <div class="breadcrumb"><a href="index.html">首页</a> / 登录注册</div>
  </section>

  <main class="container page-wrap">
    <div class="form-card">

      <!-- Tab 切换（jQuery addClass/removeClass） -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-tab="login">登录</button>
        <button type="button" class="auth-tab" data-tab="register">注册</button>
      </div>

      <!-- 登录表单 -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-username">用户名 <span class="text-muted">*</span></label>
          <input type="text" class="form-control" id="login-username" placeholder="3-20 个字符" maxlength="20">
          <div class="field-error"></div>
        </div>
        <div class="form-group">
          <label for="login-password">密码 <span class="text-muted">*（6-20 位）</span></label>
          <input type="password" class="form-control" id="login-password" placeholder="请输入密码" maxlength="20">
          <div class="field-error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
        <p class="form-tip">还没有账号？<a href="javascript:;" id="go-register">去注册</a></p>
      </form>

      <!-- 注册表单 -->
      <form id="register-form" class="hidden" novalidate>
        <div class="form-group">
          <label for="reg-username">用户名 <span class="text-muted">*</span></label>
          <input type="text" class="form-control" id="reg-username" placeholder="3-20 个字符" maxlength="20">
          <div class="field-error"></div>
        </div>
        <div class="form-group">
          <label for="reg-email">邮箱 <span class="text-muted">*</span></label>
          <input type="email" class="form-control" id="reg-email" placeholder="example@domain.com">
          <div class="field-error"></div>
        </div>
        <div class="form-group">
          <label for="reg-password">密码 <span class="text-muted">*（6-20 位）</span></label>
          <input type="password" class="form-control" id="reg-password" placeholder="设置 6-20 位密码" maxlength="20">
          <div class="field-error"></div>
        </div>
        <div class="form-group">
          <label for="reg-confirm">确认密码 <span class="text-muted">*</span></label>
          <input type="password" class="form-control" id="reg-confirm" placeholder="再次输入密码" maxlength="20">
          <div class="field-error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">注 册</button>
        <p class="form-tip">已有账号？<a href="javascript:;" id="go-login">去登录</a></p>
      </form>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <div class="footer-brand">尹晓晓的小站</div>
        <div class="footer-copy">© 2026 尹晓晓 · 个人博客与作品商城 · 纯前端学习实践项目</div>
      </div>
      <div class="footer-links">
        <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
        <a href="https://juejin.cn" target="_blank" rel="noopener">掘金</a>
        <a href="https://www.zhihu.com" target="_blank" rel="noopener">知乎</a>
        <a href="contact.html">联系我</a>
      </div>
    </div>
  </footer>

  <button id="back-to-top" title="回到顶部" aria-label="回到顶部">↑</button>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/form.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
