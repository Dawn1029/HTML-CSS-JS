<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言板 · 林泽的个人博客与作品商城</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="messages">

  <header class="site-header">
    <div class="navbar">
      <a href="index.html" class="logo"><span class="logo-mark">林</span>林泽的小站</a>
      <button class="nav-toggle" aria-label="打开菜单"><span></span><span></span><span></span></button>
      <nav class="nav-menu">
        <a href="index.html">首页</a>
        <a href="about.html">关于我</a>
        <a href="articles.html">博客</a>
        <a href="works.html">作品</a>
        <a href="messages.html">留言</a>
        <a href="cart.html" class="cart-link">购物车<span class="cart-badge" id="cart-count">0</span></a>
        <span id="nav-auth"></span>
      </nav>
    </div>
  </header>

  <section class="page-header">
    <h1>留言板</h1>
    <div class="breadcrumb"><a href="index.html">首页</a> / 留言板</div>
  </section>

  <main class="container page-wrap">
    <div class="message-layout">

      <!-- 左侧：发表留言表单 -->
      <div class="message-form-box">
        <h3>发表留言</h3>
        <form id="message-form" novalidate>
          <div class="form-group">
            <label for="msg-name">昵称 <span class="text-muted">*</span></label>
            <input type="text" class="form-control" id="msg-name" placeholder="2-20 个字符" maxlength="20">
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label for="msg-email">邮箱 <span class="text-muted">*</span></label>
            <input type="email" class="form-control" id="msg-email" placeholder="example@domain.com">
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label for="msg-content">留言内容 <span class="text-muted">*（5-200 字）</span></label>
            <textarea class="form-control" id="msg-content" placeholder="写下你想对我说的话…" maxlength="200"></textarea>
            <div class="field-error"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">发表留言</button>
        </form>
      </div>

      <!-- 右侧：最新留言列表（jQuery 渲染 localStorage 数据） -->
      <div class="message-list-box">
        <h3>最新留言</h3>
        <div id="message-list"></div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <div class="footer-brand">林泽的小站</div>
        <div class="footer-copy">© 2026 林泽 · 个人博客与作品商城 · 纯前端学习实践项目</div>
      </div>
      <div class="footer-links">
        <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
        <a href="https://juejin.cn" target="_blank" rel="noopener">掘金</a>
        <a href="https://www.zhihu.com" target="_blank" rel="noopener">知乎</a>
        <a href="contact.html">联系我</a>
      </div>
    </div>
  </footer>

  <button id="back-to-top" title="回到顶部" aria-label="回到顶部">↑</button>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/form.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
